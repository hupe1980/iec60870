[[test]]
name = "reference_capture"
path = "tests/reference_capture.rs"

# The 104 oracle frames ASDUs in APCI I-frames, so it belongs to the 104 build.
[[test]]
name = "tshark_oracle"
path = "tests/tshark_oracle.rs"
required-features = ["cs104"]

