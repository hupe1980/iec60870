name: CI
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Wireshark's stable dissector
        run: |
          sudo add-apt-repository --yes ppa:wireshark-dev/stable
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes tshark
          tshark --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check each feature in isolation, including documentation examples
        run: |
          for feature in "" std cs104 cs101 serial tokio tls file-transfer file-store-fs cli; do
            cargo check --locked --no-default-features --features "$feature" --all-targets
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$feature"
            cargo test --locked --no-default-features --features "$feature" --doc
          done
      - name: Run the suite with required dissector evidence
        env:
          IEC60870_REQUIRE_TSHARK: '1'
        run: |
          cargo test --locked --all-features
          diff -u site/static/conformance.md target/conformance/coverage.md
          cat target/conformance/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check crate contents and test the packaged CLI
        run: |
          cargo package --locked --list > "$RUNNER_TEMP/package-files"
          if grep -E '^(concepts|specs|\.specify|\.claude|\.github|site|target|fuzz)/' "$RUNNER_TEMP/package-files"; then
            echo "::error::Unexpected private or development content in the crate"
            exit 1
          fi
          cargo package --locked
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          manifest="target/package/iec60870-$version/Cargo.toml"
          cargo check --locked --all-features --all-targets --manifest-path "$manifest"
          cargo test --locked --features cli,tls,serial --test cli --manifest-path "$manifest"
      - name: Simulate 10,000 seeds per scenario
        env:
          SIM_SEEDS: '10000'
        run: cargo test --locked --release --all-features --test simulation --test cs101_simulation --test station_simulation
      - name: Run the local examples
        run: |
          for path in examples/*.rs; do
            name=$(basename "$path" .rs)
            cargo run --locked --all-features --example "$name"
          done
      - name: Build API reference
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Check docs.rs rendering on nightly
        continue-on-error: true
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly doc --locked --no-deps --all-features

  field-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: scripts/test-field-oracle.sh

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run each independent peer suite
        env:
          IEC60870_REQUIRE_INTEROP: '1'
        run: |
          for path in tests/interop*.rs; do
            name=$(basename "$path" .rs)
            cargo test --locked --all-features --test "$name" -- --test-threads=1
          done

  no_std:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --locked --no-default-features --features cs104,cs101,file-transfer --target thumbv7em-none-eabihf
          cargo build --locked --manifest-path examples/embedded/Cargo.toml --target thumbv7em-none-eabihf
          cargo test --locked --manifest-path examples/embedded/Cargo.toml

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --all-features --all-targets

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.2
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          targets=$(cargo fuzz list)
          test -n "$targets"
          for name in $targets; do
            cargo +nightly fuzz run "$name" -- -max_total_time=60
          done
          git diff --exit-code -- fuzz/Cargo.lock

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --locked check
