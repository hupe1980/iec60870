name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      stable: ${{ steps.manifest.outputs.stable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: manifest
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected tag v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${version%%+*}" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo publish --locked --dry-run

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - { os: macos-15, platform: darwin-aarch64 }
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build, exercise and archive the CLI
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          cargo build --locked --release --features cli,tls,serial --bin iec60870
          test "$(target/release/iec60870 --version)" = "iec60870 $VERSION"
          target/release/iec60870 decode 680407000000 | grep -F 'STARTDT act'
          tar -czf "iec60870-$PLATFORM.tar.gz" -C target/release iec60870
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.platform }}
          path: iec60870-*.tar.gz
          if-no-files-found: error
          overwrite: true

  package:
    name: Package and test Homebrew distribution
    needs: [guard, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        working-directory: dist
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          shasum -a 256 iec60870-*.tar.gz > checksums.txt
          ../packaging/homebrew/formula.sh "$VERSION" checksums.txt > iec60870.rb
          ruby -c iec60870.rb
      - name: Install and test the packaged formula before publication
        run: |
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          sed "s|https://github.com/hupe1980/iec60870/releases/download/[^/]*/|file://$PWD/dist/|g" \
            dist/iec60870.rb > "$RUNNER_TEMP/tap/Formula/iec60870.rb"
          git -C "$RUNNER_TEMP/tap" init -q
          git -C "$RUNNER_TEMP/tap" add Formula
          git -C "$RUNNER_TEMP/tap" -c user.name=CI -c user.email=ci@localhost commit -qm formula
          brew tap release-check/local "file://$RUNNER_TEMP/tap"
          brew install release-check/local/iec60870
          brew test release-check/local/iec60870
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution
          path: dist/
          overwrite: true

  stage:
    name: Stage GitHub Release assets
    if: github.event_name == 'push'
    needs: [ci, package, guard]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - name: Prepare draft or verify previously published assets
        working-directory: dist
        env:
          STABLE: ${{ needs.guard.outputs.stable }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c checksums.txt
          if ! draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            args=(--draft --verify-tag --generate-notes)
            if [[ "$STABLE" == false ]]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" --clobber ./*.tar.gz checksums.txt iec60870.rb
          fi
          verified="$RUNNER_TEMP/release-assets"
          gh release download "$GITHUB_REF_NAME" --dir "$verified" \
            --pattern 'iec60870-*.tar.gz' --pattern checksums.txt --pattern iec60870.rb
          if [[ "$draft" == true ]]; then cmp checksums.txt "$verified/checksums.txt"; fi
          renderer="$GITHUB_WORKSPACE/packaging/homebrew/formula.sh"
          cd "$verified"
          sha256sum -c checksums.txt
          "$renderer" "${GITHUB_REF_NAME#v}" checksums.txt | cmp - iec60870.rb

  publish:
    needs: [stage, guard]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check whether the crate was already published
        id: registry
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          cargo package --locked
          checksum=$(sha256sum "target/package/iec60870-$VERSION.crate" | cut -d' ' -f1)
          curl --fail --silent --show-error --retry 3 https://index.crates.io/ie/c6/iec60870 > "$RUNNER_TEMP/index"
          existing=$(jq -r --arg v "$VERSION" 'select(.vers == $v) | .cksum' "$RUNNER_TEMP/index")
          if [[ -n "$existing" && "$existing" != "$checksum" ]]; then
            echo "::error::Registry version $VERSION already contains a different archive"
            exit 1
          fi
          echo "checksum=$existing" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.registry.outputs.checksum == ''
        id: auth
      - if: steps.registry.outputs.checksum == ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then gh release edit "$GITHUB_REF_NAME" --draft=false; fi

  tap:
    needs: [release, guard]
    if: needs.guard.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    environment: homebrew
    steps:
      - name: Fetch the published formula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern iec60870.rb
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hupe1980/homebrew-tap
          path: tap
          token: ${{ steps.app.outputs.token }}
      - name: Update the stable formula
        working-directory: tap
        run: |
          version=${GITHUB_REF_NAME#v}
          formula=Formula/iec60870.rb
          if [[ -f "$formula" ]]; then
            previous=$(sed -n 's/^  version "\(.*\)"/\1/p' "$formula")
            if [[ $(printf '%s\n' "$previous" "$version" | sort -V | tail -1) != "$version" ]]; then
              echo "Tap already serves $previous"
              exit 0
            fi
          fi
          install -Dm644 ../iec60870.rb "$formula"
          git add "$formula"
          if ! git diff --cached --quiet; then
            git config user.name "iec60870 release"
            git config user.email "iec60870-release@users.noreply.github.com"
            git commit -m "iec60870 $version"
            git push
          fi
