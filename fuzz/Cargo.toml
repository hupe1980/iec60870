[package]
name = "iec60870-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
iec60870 = { path = "..", default-features = false, features = ["cs104", "cs101", "file-transfer"] }

# Not a member of the crate's workspace.
[workspace]
members = ["."]

[[bin]]
name = "asdu_cs104"
path = "fuzz_targets/asdu_cs104.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asdu_cs101"
path = "fuzz_targets/asdu_cs101.rs"
test = false
doc = false
bench = false

